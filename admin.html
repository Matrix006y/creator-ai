<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator AI — Panel Admina</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #080b0d;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
    }

    #orders {
      max-width: 800px;
      margin: auto;
    }

    .order {
      background: #12171a;
      border: 1px solid #263238;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .order h2 {
      margin-top: 0;
      color: #36c5d0;
    }

    .order p {
      margin: 8px 0;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #263238;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <h1>Panel Admina</h1>

    <p>Ładowanie zamówień...</p>
