<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator AI — Panel Admina</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #080b0d;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
    }

    #orders {
      max-width: 800px;
      margin: auto;
    }

    .order {
      background: #12171a;
      border: 1px solid #263238;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .order h2 {
      margin-top: 0;
      color: #36c5d0;
    }

    .order p {
      margin: 8px 0;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #263238;
      margin-top: 8px;
    }
  </style>
</head>
<script>
const SUPABASE_URL = "https://yhuqrhcbljiebkufwpnl.supabase.co/rest/v1/orders";
const SUPABASE_KEY = "sb_publishable__CetCkBZCQIclSvrhsWYzg_SqJseGD3";

async function loadOrders() {
  const ordersDiv = document.getElementById("orders");

  try {
    const response = await fetch(
      SUPABASE_URL + "?select=*&order=created_at.desc",
      {
        headers: {
          "apikey": SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      const error = await response.text();
      ordersDiv.innerHTML = "<p>Błąd: " + error + "</p>";
      return;
    }

    const orders = await response.json();

    if (orders.length === 0) {
      ordersDiv.innerHTML = "<p>Brak zamówień.</p>";
      return;
    }

    ordersDiv.innerHTML = "";

    orders.forEach(order => {
      ordersDiv.innerHTML += `
        <div class="order">
          <h2>Zamówienie #${order.id}</h2>
          <p><b>Rodzaj:</b> ${order.Type || "-"}</p>
          <p><b>Temat:</b> ${order.Topic || "-"}</p>
          <p><b>Opis:</b> ${order.description || "-"}</p>
          <p><b>Email:</b> ${order.Email || "-"}</p>
          <span class="status">${order.Status || "Nowe"}</span>
        </div>
      `;
    });

  } catch (error) {
    ordersDiv.innerHTML = "<p>Nie udało się połączyć z bazą.</p>";
  }
}

loadOrders();
</script>
<body>

  <h1>Panel Admina</h1>
  <p class="subtitle">Zamówienia Creator AI</p>

  <div id="orders">
    <p>Ładowanie zamówień...</p>
  </div>

</body>
</html>
