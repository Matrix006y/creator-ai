<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creator AI — Panel Admina</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #080b0d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
    }

    h1 {
      text-align: center;
      font-size: 40px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 35px;
    }

    #loginBox {
      max-width: 450px;
      margin: auto;
      background: #12171a;
      border: 1px solid #263238;
      border-radius: 18px;
      padding: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #37474f;
      background: #080b0d;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #18cbe8;
      color: #050708;
      font-weight: bold;
      cursor: pointer;
    }

    #loginBox button {
      width: 100%;
    }

    #loginMessage {
      color: #ff6b6b;
      margin-top: 15px;
    }

    #adminPanel {
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .order {
      background: #12171a;
      border: 1px solid #263238;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .order h2 {
      margin-top: 0;
      color: #36c5d0;
    }

    .order p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: #263238;
      margin: 8px 0 15px;
    }

    .statusButtons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .statusButtons button {
      flex: 1;
      min-width: 100px;
    }

    .error {
      color: #ff6b6b;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGOWANIE -->

  <div id="loginSection">

    <h1>Panel Admina</h1>
    <p class="subtitle">Zaloguj się do Creator AI</p>

    <div id="loginBox">

      <input
        type="email"
        id="email"
        placeholder="Email administratora"
      >

      <input
        type="password"
        id="password"
        placeholder="Hasło"
      >

      <button onclick="login()">
        Zaloguj
      </button>

      <p id="loginMessage"></p>

    </div>

  </div>


  <!-- PANEL -->

  <div id="adminPanel">

    <div class="topbar">

      <h2>Zamówienia Creator AI</h2>

      <button onclick="logout()">
        Wyloguj
      </button>

    </div>

    <div id="orders">
      <p>Ładowanie zamówień...</p>
    </div>

  </div>

</div>


<script>

const PROJECT_URL =
  "https://yhuqrhcbljiebkufwpnl.supabase.co";

const PUBLISHABLE_KEY =
  "sb_publishable__CetCkBZCQIclSvrhsWYzg_SqJseGD3";

let accessToken = null;


/* =========================
   LOGOWANIE
========================= */

async function login() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "Logowanie...";

  try {

    const response = await fetch(
      PROJECT_URL + "/auth/v1/token?grant_type=password",
      {
        method: "POST",

        headers: {
          "apikey": PUBLISHABLE_KEY,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {

      message.textContent =
        "Błąd logowania: " +
        (data.error_description ||
         data.msg ||
         data.message ||
         "Nieprawidłowe dane");

      return;
    }

    accessToken = data.access_token;

    sessionStorage.setItem(
      "creatorAiToken",
      accessToken
    );

    showAdmin();

  } catch (error) {

    message.textContent =
      "Nie udało się połączyć z serwerem.";

  }

}


/* =========================
   PANEL
========================= */

function showAdmin() {

  document.getElementById("loginSection")
    .style.display = "none";

  document.getElementById("adminPanel")
    .style.display = "block";

  loadOrders();

}


/* =========================
   POBIERANIE ZAMÓWIEŃ
========================= */

async function loadOrders() {

  const ordersDiv =
    document.getElementById("orders");

  ordersDiv.innerHTML =
    "<p>Ładowanie zamówień...</p>";

  try {

    const response = await fetch(
      PROJECT_URL +
      "/rest/v1/orders?select=*&order=created_at.desc",
      {
        headers: {
          "apikey": PUBLISHABLE_KEY,
          "Authorization": "Bearer " + accessToken
        }
      }
    );

    if (!response.ok) {

      const error = await response.text();

      ordersDiv.innerHTML =
        '<p class="error">Błąd: ' +
        error +
        "</p>";

      return;
    }

    const orders = await response.json();

    if (orders.length === 0) {

      ordersDiv.innerHTML =
        "<p>Brak zamówień.</p>";

      return;
    }

    ordersDiv.innerHTML = "";

    orders.forEach(order => {

      const card =
        document.createElement("div");

      card.className = "order";

      card.innerHTML = `
        <h2>Zamówienie #${order.id}</h2>

        <p>
          <b>Rodzaj:</b>
          ${order.Type || "-"}
        </p>

        <p>
          <b>Temat:</b>
          ${order.Topic || "-"}
        </p>

        <p>
          <b>Opis:</b>
          ${order.description || "-"}
        </p>

        <p>
          <b>Email:</b>
          ${order.Email || "-"}
        </p>

        <p>
          <b>Status:</b>
        </p>

        <div class="status">
          ${order.Status || "Nowe"}
        </div>

        <div class="statusButtons">

          <button onclick="changeStatus(${order.id}, 'Nowe')">
            Nowe
          </button>

          <button onclick="changeStatus(${order.id}, 'W trakcie')">
            W trakcie
          </button>

          <button onclick="changeStatus(${order.id}, 'Gotowe')">
            Gotowe
          </button>

        </div>
      `;

      ordersDiv.appendChild(card);

    });

  } catch (error) {

    ordersDiv.innerHTML =
      '<p class="error">Nie udało się pobrać zamówień.</p>';

  }

}


/* =========================
   ZMIANA STATUSU
========================= */

async function changeStatus(orderId, newStatus) {

  try {

    const response = await fetch(
      PROJECT_URL +
      "/rest/v1/orders?id=eq." +
      orderId,
      {
        method: "PATCH",

        headers: {
          "apikey": PUBLISHABLE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({
          Status: newStatus
        })
      }
    );

    if (!response.ok) {

      const error = await response.text();

      alert(
        "Błąd zmiany statusu: " +
        error
      );

      return;
    }

    await loadOrders();

  } catch (error) {

    alert(
      "Nie udało się zmienić statusu."
    );

  }

}


/* =========================
   WYLOGOWANIE
========================= */

function logout() {

  sessionStorage.removeItem(
    "creatorAiToken"
  );

  accessToken = null;

  document.getElementById("adminPanel")
    .style.display = "none";

  document.getElementById("loginSection")
    .style.display = "block";

}


/* =========================
   SESJA
========================= */

const savedToken =
  sessionStorage.getItem(
    "creatorAiToken"
  );

if (savedToken) {

  accessToken = savedToken;

  showAdmin();

}

</script>

</body>
</html>
